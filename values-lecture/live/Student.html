<!doctype html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>بوصلتك الداخلية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500..700&family=Tajawal:wght@400;500;700&display=swap">
<style>
  :root {
    --lapis:#0B106E; --lapis2:#1B2391; --sand:#EDEDED; --sand2:#E2E3EA; --card:#F8F8FB; --line:#D3D5E0;
    --copper:#E8640A; --copper-d:#A94300; --blue:#3C5CA8; --gold:#F07A1E; --soft:#4A4A58;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--sand); color:var(--lapis); }
  body { font-family:'Tajawal', Tahoma, sans-serif; font-size:17px; line-height:1.6; min-height:100vh; }
  h1, h2 { font-family:'Reem Kufi', Tahoma, sans-serif; margin:0; line-height:1.35; }
  .top { background:var(--lapis); color:var(--sand); padding:16px 18px 0; }
  .top .brand { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--gold); font-weight:700; }
  .top h1 { font-size:24px; margin:4px 0 8px; }
  .band { display:block; width:100%; height:20px; }
  main { padding:16px 16px 32px; max-width:560px; margin:0 auto; }
  .screen { display:none; }
  .screen.on { display:block; animation:fade .3s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .card { background:var(--card); border-radius:18px; padding:18px; box-shadow:0 4px 18px rgba(11,16,110,.08); }
  .muted { color:var(--soft); font-size:15px; }
  .btn { display:block; width:100%; border:0; border-radius:14px; padding:15px; font:700 18px 'Tajawal', Tahoma, sans-serif; background:var(--lapis); color:#fff; cursor:pointer; margin-top:10px; }
  .btn.orange { background:var(--copper); }
  .btn.ghost { background:transparent; color:var(--copper-d); padding:10px; font-size:15px; }
  .btn:disabled { opacity:.45; }
  .tag { display:inline-block; background:var(--copper); color:#fff; font-weight:700; font-size:13px; border-radius:6px; padding:2px 10px; margin-bottom:8px; }
  .q { font-family:'Reem Kufi', Tahoma, sans-serif; font-size:21px; font-weight:600; margin:0 0 14px; }
  .opt { display:flex; align-items:center; gap:12px; width:100%; text-align:right; background:#fff; border:2px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:10px; font:500 17px 'Tajawal', Tahoma, sans-serif; color:var(--lapis); cursor:pointer; }
  .opt.sel { border-color:var(--copper); background:#FFF3EA; }
  .opt b { display:block; }
  .let { flex:none; width:34px; height:34px; border-radius:17px; display:flex; align-items:center; justify-content:center; font:700 17px 'Reem Kufi', Tahoma, sans-serif; }
  .let.a { background:var(--lapis); color:#fff; }
  .let.b { background:var(--gold); color:var(--lapis); }
  .let.c { background:#B9C2CC; color:var(--lapis); }
  .prog { display:flex; gap:7px; justify-content:center; margin:2px 0 14px; flex-wrap:wrap; }
  .pd { width:11px; height:11px; background:var(--line); transform:rotate(45deg); }
  .pd.done { background:#F3B27F; }
  .pd.on { width:15px; height:15px; background:var(--copper); }
  .qno { display:flex; align-items:center; gap:10px; color:var(--copper-d); font-weight:700; font-size:14px; margin-bottom:6px; }
  .star { position:relative; width:30px; height:30px; flex:none; }
  .star::before, .star::after { content:""; position:absolute; inset:4px; background:var(--copper); }
  .star::after { transform:rotate(45deg); }
  .star span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; z-index:1; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px; }
  .chip { border:2px solid var(--line); background:#fff; border-radius:30px; padding:9px 15px; font:500 16px 'Tajawal', Tahoma, sans-serif; color:var(--lapis); cursor:pointer; }
  .chip.sel { color:#fff; border-color:transparent; font-weight:700; }
  .chip.plain.sel { background:var(--copper); }
  .lbl { font-weight:700; margin:12px 0 0; }
  textarea { width:100%; min-height:84px; border:2px solid var(--line); border-radius:12px; padding:10px; font:16px 'Tajawal', Tahoma, sans-serif; color:var(--lapis); resize:vertical; }
  .count { font-size:13px; color:var(--soft); text-align:left; }
  .bars { display:flex; flex-direction:column; gap:10px; margin:12px 0 6px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-name { width:96px; font-weight:700; font-size:15px; }
  .bar-track { flex:1; height:22px; background:var(--sand2); border-radius:11px; overflow:hidden; display:flex; }
  .bar-fill { height:100%; border-radius:11px; transition:width .8s ease; }
  .bar-val { width:30px; text-align:left; font-weight:700; font-size:15px; }
  .note { background:var(--lapis); color:#fff; border-radius:16px; padding:14px 16px; margin:14px 0 0; }
  .note b { color:var(--gold); }
  .ok { color:#1F7A4A; font-weight:700; }
  .err { color:#A3305F; font-weight:700; display:none; margin-top:8px; }
  .spin { width:28px; height:28px; border:4px solid var(--line); border-top-color:var(--copper); border-radius:50%; animation:sp 1s linear infinite; margin:18px auto; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .banner { display:none; position:sticky; top:0; z-index:5; background:var(--copper); color:#fff; padding:10px 14px; font-weight:700; text-align:center; }
  .banner button { margin-right:8px; border:0; background:#fff; color:var(--copper-d); font:700 14px 'Tajawal', Tahoma, sans-serif; border-radius:20px; padding:4px 12px; }
  .vcard { background:var(--lapis); color:#fff; border-radius:20px; padding:20px; margin-top:10px; }
  .vcard h2 { font-size:22px; color:#fff; }
  .vcard .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 12px; }
  .vcard .pill { border-radius:20px; padding:6px 14px; font-weight:700; color:#fff; }
  .vcard .sub { color:var(--gold); font-weight:700; font-size:14px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="bandp" width="26" height="20" patternUnits="userSpaceOnUse"><g fill="none" stroke="#F07A1E" stroke-width="1.2"><rect x="7" y="4" width="12" height="12"/><rect x="7" y="4" width="12" height="12" transform="rotate(45 13 10)"/><path d="M0 10H3M23 10H26"/></g></pattern>
</defs></svg>

<div class="banner" id="banner">بدأ نشاط جديد<button id="bannerGo">انتقل إليه</button></div>
<header class="top">
  <div class="brand"><span style="display:inline-block;width:8px;height:8px;background:var(--gold);transform:rotate(45deg)"></span>بوصلتك الداخلية · رحلة في عالم القيم</div>
  <h1 id="title">أهلًا بك</h1>
  <svg class="band" viewBox="0 0 520 20" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="520" height="20" fill="url(#bandp)"/></svg>
</header>

<main id="main"></main>

<script>
  /* ================= المحتوى: عدّل النصوص هنا ================= */
  var VALUES = [
    ['العلمية', '#3C5CA8'], ['الاقتصادية', '#E8640A'], ['الاجتماعية', '#0E7C86'],
    ['الجمالية', '#A3305F'], ['السياسية', '#5C5A1C'], ['الدينية', '#1F7A4A']
  ];
  var TITLES = {
    jobs: 'العرضان الوظيفيان', discover: 'اكتشف قيمك', lead: 'تصويت: الترشح', help: 'تصويت: المساعدة المالية',
    exam: 'تصويت: الامتحان والمقال', share: 'قيمة من البيت', card: 'بطاقة قيمي',
    c1: 'صراع القيم', c2: 'صراع القيم', c3: 'صراع القيم', c4: 'صراع القيم', c5: 'صراع القيم', c6: 'صراع القيم'
  };
  var JOBS = { q: 'تخرّجت، وأمامك عرضان. أيّهما تختار؟', a: ['شركة كبرى في مسقط', 'راتب مرتفع وحوافز، وساعات عمل طويلة، وبُعد عن الأهل والولاية'], b: ['مؤسسة قريبة من بيتك', 'راتب أقل، وعمل تشعر بقيمته ومعناه، ووقت كافٍ للأسرة والمجتمع'] };
  // نصوص المواقف الثلاثة حرفيًا من الصورة النهائية للمقياس (الملحق 5)
  var POLLS = {
    lead: ['تم ترشيحك لرئاسة جماعة طلابية في الجامعة، ماذا تفعل؟', 'تقبل الترشح لأنك تستمتع بالقيادة.', 'تترشح فقط إذا وجدت الدعم الكافي من زملائك.', 'ترفض الترشح لأنك لا ترغب في تحمل المسؤولية.'],
    help: ['تعرّض أحد زملائك لضائقة مالية وأنت على علم بذلك، ماذا تفعل؟', 'تقدّم له الدعم بقدر الاستطاعة.', 'تخبر زملاءك ليجمعوا له التبرعات.', 'لا تهتم بأمره.'],
    exam: ['لديك امتحان غدًا، ولكنك تجد مقالًا مثيرًا لاهتمامك، ماذا تفعل؟', 'تقرأ المقال لأنه يوسّع معرفتك.', 'تقسم وقتك بين المقال والمذاكرة.', 'تركز على المذاكرة للامتحان وتترك المقال لاحقًا.']
  };
  var ITEMS = [
    ['انتهت المحاضرة وبقي في ذهنك سؤال لم يُجب عنه', 'أبحث عن الإجابة في مصادر موثوقة حتى أصل إليها', 'أسأل زميلًا عنه إن صادفته', 'أتركه، فهو ليس مطلوبًا في الامتحان'],
    ['حصلت على مبلغ مالي غير متوقع', 'أخصص جزءًا منه للادخار أو لمشروع ينمّيه', 'أدّخر ما يتبقى بعد مصروفاتي', 'أنفقه كاملًا على ما أرغب فيه'],
    ['لاحظت زميلًا جديدًا يجلس وحيدًا في كل محاضرة', 'أبادر بالتعرف إليه وأدعوه إلى مجموعتنا', 'أسلّم عليه إن صادفته', 'لا أتدخل، فهذا شأنه'],
    ['طُلب منك إعداد عرض تقديمي لمشروعك', 'أهتم بتنسيقه وتناسق ألوانه حتى يكون جميلًا وواضحًا', 'أستخدم قالبًا جاهزًا دون تعديل', 'يكفيني أن يحتوي المعلومات'],
    ['أُعلن عن انتخابات مجلس الطلبة في كليتك', 'أترشح، أو أساعد في حملة مرشح أقتنع به', 'أكتفي بالتصويت', 'لا أهتم بالانتخابات'],
    ['أذّن المؤذن وأنت في نقاش ممتع مع أصدقائك', 'أستأذن لأداء الصلاة في وقتها، وأعود إليهم', 'أكمل النقاش ثم أصلي', 'أؤجلها دون أن أفكر في وقتها'],
    ['قرأت منشورًا منتشرًا يدّعي معلومة صحية غريبة', 'أتحقق من مصدرها قبل أن أصدّقها أو أنشرها', 'أصدّقها إن نشرها أشخاص كثيرون', 'لا أهتم بالأمر'],
    ['عُرضت عليك دورة قصيرة برسوم، تزيد فرصك في سوق العمل', 'أدرس جدواها، وأشترك إن كان عائدها أعلى من كلفتها', 'أشترك إن اشترك زملائي', 'لا أفكر في الأمر الآن'],
    ['أُعلن عن حملة تطوعية لتنظيف شاطئ في نهاية الأسبوع', 'أشارك وأدعو أصدقائي للمشاركة', 'أشارك إن لم يكن لديّ ارتباط', 'أعتذر'],
    ['مررت بمعرض للفنون التشكيلية والخط العربي في الجامعة', 'أدخل وأتأمل الأعمال', 'ألقي نظرة سريعة من الباب', 'أكمل طريقي'],
    ['يتحاور زملاؤك حول قرار جديد يخص الطلبة', 'أشارك برأيي وأقترح حلولًا، وأوصلها لمن يهمه الأمر', 'أستمع دون أن أشارك', 'أنصرف، فلا شأن لي'],
    ['وجدت محفظة فيها مال في ساحة الجامعة', 'أسلّمها لإدارة الجامعة فورًا، أمانةً وطلبًا لرضا الله', 'أسلّمها إن مررت بمكتب الإدارة', 'أتركها مكانها']
  ];
  var CASES = [
    ['عرس أخي', 'زفاف أخيك الأكبر الليلة في الولاية، والأهل ينتظرون حضورك ومساعدتك في استقبال الضيوف. امتحانك النهائي في مقرر صعب الساعة الثامنة صباح الغد، ولم تُنهِ المراجعة بعد. والطريق إلى البيت ساعة ونصف.'],
    ['عرض الدقم', 'تخرجت مهندسًا، وجاءك عرض من شركة في الدقم براتب يقارب ضعف ما يعرضه مصنع قريب من بيتكم. والداك كبيران في السن، وأنت الابن الوحيد المقيم قريبًا منهما، وإخوتك يعملون خارج الولاية.'],
    ['كود الصديق', 'صديقك المقرّب منذ المدرسة لم يُنهِ مشروع البرمجة، والتسليم الليلة. يطلب منك أن ترسل له جزءًا من الكود الذي كتبته ليعدّله قليلًا ويسلّمه باسمه، ويقول لك: لو كنت مكاني ما تركتك.'],
    ['متجر إنستغرام', 'بدأت مع أختك متجرًا صغيرًا على إنستغرام لبيع العطور والبخور. لاحظتما أن المنشورات التي تبالغ في وصف الجودة، مثل "أصلي 100%" و"أفضل عود في عُمان"، تبيع ضعف غيرها، والمنتج جيد لكنه ليس كما تصفه تلك العبارات.'],
    ['مجلس الطلبة', 'ترشحت لمجلس الطلبة ونجحت بأصوات زملائك بعد وعود بتحسين خدمات النقل. بعد شهرين وجدت أن الاجتماعات والمتابعات تأخذ أكثر من عشر ساعات أسبوعيًا، وانخفض معدلك، والفصل القادم فيه مقررات تخصص ثقيلة.'],
    ['تصميم المشروع', 'فريقك يعمل على مشروع تخرج لتطبيق خدمي. أمامكم تصميمان للواجهة: الأول جميل ومتقن ويحتاج شراء أدوات وقوالب بضعف الميزانية المتاحة من جيوبكم، والثاني بسيط ومجاني ويؤدي الوظيفة. وزميلكم المصمم متحمس جدًا للأول.']
  ];
  /* ============================================================= */

  var AR = '٠١٢٣٤٥٦٧٨٩';
  function ar(n) { return String(n).replace(/[0-9]/g, function (d) { return AR[d]; }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var CLIENT = store('values-client');
  if (!CLIENT) { CLIENT = 'c' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); store('values-client', CLIENT); }

  var state = { act: '', session: '' };
  var shown = null;      // النشاط المعروض الآن
  var busy = false;      // الطالب في منتصف نشاط ولم يرسل بعد
  var main = document.getElementById('main');

  function doneKey(act) { return 'values-done:' + state.session + ':' + act; }
  function setTitle(t) { document.getElementById('title').textContent = t; }
  function clear() { main.innerHTML = ''; window.scrollTo(0, 0); }

  /* ---------- polling ---------- */
  function poll() {
    google.script.run.withSuccessHandler(onState).withFailureHandler(function () {}).getState(CLIENT);
  }
  function joinNow() {
    google.script.run.withSuccessHandler(onState).withFailureHandler(function () { setTimeout(joinNow, 4000); }).join(CLIENT);
  }
  function schedule() { setTimeout(function () { poll(); schedule(); }, 9000 + Math.random() * 5000); }
  function onState(st) {
    if (state.session && st.session !== state.session) joinNow();
    var changed = st.act !== state.act || st.session !== state.session;
    state = st;
    if (!changed && shown !== null) return;
    if (busy && shown && shown !== st.act) { document.getElementById('banner').style.display = st.act ? 'block' : 'none'; return; }
    render();
  }
  document.getElementById('bannerGo').onclick = function () { busy = false; document.getElementById('banner').style.display = 'none'; render(); };

  function render() {
    document.getElementById('banner').style.display = 'none';
    shown = state.act;
    if (!state.act) return renderWait();
    var saved = store(doneKey(state.act));
    if (saved) return renderSent(state.act, JSON.parse(saved));
    var R = { jobs: renderJobs, discover: renderDiscoverIntro, lead: renderPoll, help: renderPoll, exam: renderPoll,
       c1: renderConflict, c2: renderConflict, c3: renderConflict, c4: renderConflict, c5: renderConflict, c6: renderConflict,
       share: renderShare, card: renderCard }[state.act];
    if (R) R(); else renderWait();
  }

  function renderWait() {
    busy = false; setTitle('أهلًا بك'); clear();
    var c = el('div', 'card');
    c.appendChild(el('h2', null, 'أنت متصل'));
    c.appendChild(el('p', null, 'ابقَ على هذه الصفحة. حين يبدأ المحاضر نشاطًا سيظهر هنا تلقائيًا.'));
    c.appendChild(el('p', 'muted', 'إجاباتك بلا اسم، ولا يرى أحد إجابتك الفردية. تظهر على الشاشة نتائج القاعة مجتمعة فقط.'));
    c.appendChild(el('div', 'spin'));
    main.appendChild(c);
  }

  /* ---------- sending ---------- */
  function send(act, data, extra, view) {
    clear();
    var c = el('div', 'card'); c.style.textAlign = 'center'; c.appendChild(el('div', 'spin')); c.appendChild(el('p', null, 'جارٍ الإرسال…')); main.appendChild(c);
    var payload = { act: act, client: CLIENT, data: data };
    if (extra) { payload.college = extra.college; payload.gender = extra.gender; }
    google.script.run
      .withSuccessHandler(function () { busy = false; store(doneKey(act), JSON.stringify(view || {})); renderSent(act, view || {}); })
      .withFailureHandler(function () {
        clear();
        var e = el('div', 'card');
        e.appendChild(el('p', null, 'لم تصل الإجابة بسبب الاتصال.'));
        var b = el('button', 'btn orange', 'أعد الإرسال'); b.onclick = function () { send(act, data, extra, view); };
        e.appendChild(b); main.appendChild(e);
      })
      .submit(payload);
  }

  function renderSent(act, view) {
    busy = false; setTitle(TITLES[act]); clear();
    var c = el('div', 'card');
    if (act === 'discover' && view.answers) { profileInto(c, view.answers); }
    else if (act === 'card' && view.top) { cardInto(c, view); }
    c.appendChild(el('p', 'ok', 'وصلت إجابتك. انظر إلى الشاشة لترى نتائج القاعة.'));
    c.appendChild(el('p', 'muted', 'سينتقل جوالك تلقائيًا حين يبدأ المحاضر النشاط التالي.'));
    var again = el('button', 'btn ghost', 'عدّل إجابتي');
    again.onclick = function () { try { localStorage.removeItem(doneKey(act)); } catch (e) {} render(); };
    c.appendChild(again);
    main.appendChild(c);
  }

  /* ---------- generic choice ---------- */
  function choiceCard(tagText, q, options, onPick) {
    clear();
    var c = el('div', 'card');
    c.appendChild(el('span', 'tag', tagText));
    c.appendChild(el('p', 'q', q));
    options.forEach(function (o, j) {
      var b = el('button', 'opt');
      var l = el('span', 'let ' + 'abc'[j], 'أبج'[j]);
      var t = el('span');
      if (Array.isArray(o)) { t.appendChild(el('b', null, o[0])); t.appendChild(el('span', 'muted', o[1])); } else { t.textContent = o; }
      b.appendChild(l); b.appendChild(t);
      b.onclick = function () { onPick('abc'[j]); };
      c.appendChild(b);
    });
    main.appendChild(c);
  }

  function renderJobs() {
    busy = true; setTitle(TITLES.jobs);
    choiceCard('صوّت', JOBS.q, [JOBS.a, JOBS.b], function (k) { send('jobs', k, null, {}); });
  }

  function renderPoll() {
    var act = state.act, p = POLLS[act];
    busy = true; setTitle(TITLES[act]);
    choiceCard('صوّت ثم قارن بزملائك في الدراسة', p[0], p.slice(1), function (k) { send(act, k, null, {}); });
  }

  /* ---------- discover ---------- */
  var answers, about, cur;
  function renderDiscoverIntro() {
    busy = true; setTitle(TITLES.discover); clear();
    answers = new Array(ITEMS.length).fill(''); about = { college: '', gender: '' }; cur = 0;
    var c = el('div', 'card');
    c.appendChild(el('h2', null, '12 موقفًا من حياتك الجامعية'));
    c.appendChild(el('p', null, 'اختر في كل موقف ما ستفعله فعلًا، لا ما ترى أنه يجب أن تفعله.'));
    c.appendChild(el('p', 'muted', 'نسخة مختصرة للتأمل، وليست مقياسًا كاملًا.'));
    var b = el('button', 'btn', 'ابدأ'); b.onclick = renderQ; c.appendChild(b);
    main.appendChild(c);
  }
  function renderQ() {
    clear();
    var prog = el('div', 'prog');
    for (var i = 0; i < ITEMS.length; i++) prog.appendChild(el('span', 'pd' + (i === cur ? ' on' : (answers[i] ? ' done' : ''))));
    main.appendChild(prog);
    var it = ITEMS[cur], c = el('div', 'card');
    var qn = el('div', 'qno'); var st = el('span', 'star'); st.appendChild(el('span', null, ar(cur + 1))); qn.appendChild(st); qn.appendChild(el('span', null, 'موقف ' + ar(cur + 1) + ' من ' + ar(ITEMS.length))); c.appendChild(qn);
    c.appendChild(el('p', 'q', it[0]));
    ['a', 'b', 'c'].forEach(function (k, j) {
      var b = el('button', 'opt' + (answers[cur] === k ? ' sel' : ''));
      b.appendChild(el('span', 'let ' + k, 'أبج'[j])); b.appendChild(el('span', null, it[j + 1]));
      b.onclick = function () {
        answers[cur] = k; b.classList.add('sel');
        setTimeout(function () { if (cur < ITEMS.length - 1) { cur++; renderQ(); } else { renderAbout(); } }, 200);
      };
      c.appendChild(b);
    });
    if (cur > 0) { var back = el('button', 'btn ghost', 'السابق'); back.onclick = function () { cur--; renderQ(); }; c.appendChild(back); }
    main.appendChild(c);
  }
  function chipGroup(parent, items, max, selected, colored, onChange) {
    var g = el('div', 'chips');
    items.forEach(function (it, i) {
      var b = el('button', 'chip' + (colored ? '' : ' plain'), Array.isArray(it) ? it[0] : it);
      function paint() { var on = selected.indexOf(i) >= 0; b.classList.toggle('sel', on); b.style.background = on && colored ? it[1] : ''; }
      b.onclick = function () {
        var k = selected.indexOf(i);
        if (k >= 0) selected.splice(k, 1);
        else { if (selected.length >= max) selected.shift(); selected.push(i); }
        Array.prototype.forEach.call(g.children, function (x) { x._paint(); });
        onChange && onChange();
      };
      b._paint = paint; paint(); g.appendChild(b);
    });
    parent.appendChild(g);
    return g;
  }
  function renderAbout() {
    clear();
    var c = el('div', 'card');
    c.appendChild(el('h2', null, 'سؤالان اختياريان'));
    c.appendChild(el('p', 'muted', 'للمقارنة بين المجموعات في القاعة فقط. يمكنك تخطيهما.'));
    c.appendChild(el('p', 'lbl', 'كليتك'));
    var col = [], gen = [];
    var cKeys = ['eng', 'it', 'bus', 'other'], gKeys = ['m', 'f'];
    chipGroup(c, ['الهندسة', 'تقنية المعلومات', 'الاقتصاد وإدارة الأعمال', 'أخرى'], 1, col, false);
    c.appendChild(el('p', 'lbl', 'الجنس'));
    chipGroup(c, ['طالب', 'طالبة'], 1, gen, false);
    var b = el('button', 'btn orange', 'أرسل إجاباتي');
    b.onclick = function () {
      var a = answers.join('');
      send('discover', a, { college: col.length ? cKeys[col[0]] : '', gender: gen.length ? gKeys[gen[0]] : '' }, { answers: a });
    };
    c.appendChild(b);
    var back = el('button', 'btn ghost', 'رجوع إلى المواقف'); back.onclick = function () { cur = ITEMS.length - 1; renderQ(); }; c.appendChild(back);
    main.appendChild(c);
  }
  function profileInto(c, a) {
    var sums = [0, 0, 0, 0, 0, 0];
    for (var i = 0; i < 12; i++) sums[i % 6] += a[i] === 'a' ? 3 : a[i] === 'b' ? 2 : 1;
    var p = sums.map(function (s) { return s / 2; });
    c.appendChild(el('h2', null, 'ملفك القيمي'));
    c.appendChild(el('p', 'muted', 'متوسط كل قيمة من 1 إلى 3'));
    var box = el('div', 'bars');
    var order = [0, 1, 2, 3, 4, 5].sort(function (x, y) { return p[y] - p[x]; });
    order.forEach(function (i) {
      var row = el('div', 'bar-row');
      row.appendChild(el('span', 'bar-name', VALUES[i][0]));
      var tr = el('div', 'bar-track'), f = el('div', 'bar-fill'); f.style.background = VALUES[i][1]; f.style.width = '0%'; tr.appendChild(f);
      row.appendChild(tr); row.appendChild(el('span', 'bar-val', p[i].toFixed(1)));
      box.appendChild(row);
      setTimeout(function () { f.style.width = ((p[i] - 1) / 2 * 100) + '%'; }, 60);
    });
    c.appendChild(box);
    var max = Math.max.apply(null, p);
    var tops = order.filter(function (i) { return p[i] === max; }).map(function (i) { return VALUES[i][0]; });
    var n = el('div', 'note'); n.appendChild(document.createTextNode(tops.length > 1 ? 'أعلى قيمك متعادلة: ' : 'أعلى قيمة عندك الآن: '));
    n.appendChild(el('b', null, tops.join(' و'))); c.appendChild(n);
  }

  /* ---------- conflict: the presenter picks the case, students pick the two values ---------- */
  function renderConflict() {
    var act = state.act, ci = Number(act.slice(1)) - 1, cs = CASES[ci];
    busy = true; setTitle(TITLES[act]); clear();
    var pick = [];
    var c = el('div', 'card');
    c.appendChild(el('span', 'tag', 'الحالة ' + ar(ci + 1) + ' من ٦'));
    c.appendChild(el('p', 'q', cs[0]));
    c.appendChild(el('p', null, cs[1]));
    c.appendChild(el('p', 'lbl', 'ما القيمتان المتصارعتان في هذا الموقف؟ (اختر اثنتين)'));
    var b = el('button', 'btn orange', 'أرسل'); b.disabled = true;
    chipGroup(c, VALUES, 2, pick, true, function () { b.disabled = pick.length !== 2; });
    b.onclick = function () { send(act, { v: pick.slice() }, null, {}); };
    c.appendChild(b);
    main.appendChild(c);
  }

  /* ---------- share ---------- */
  function renderShare() {
    busy = true; setTitle(TITLES.share); clear();
    var sel = [];
    var c = el('div', 'card');
    c.appendChild(el('p', 'q', 'تذكّر قيمة تعلّمتها في بيتك من أسرتك: إلى أي القيم الست تنتمي؟'));
    var b = el('button', 'btn orange', 'أرسل'); b.disabled = true;
    chipGroup(c, VALUES, 1, sel, true, function () { b.disabled = !sel.length; });
    b.onclick = function () { send('share', { v: sel[0] }, null, {}); };
    c.appendChild(b);
    main.appendChild(c);
  }

  /* ---------- card ---------- */
  function renderCard() {
    busy = true; setTitle(TITLES.card); clear();
    var top = [], grow = [];
    var c = el('div', 'card');
    c.appendChild(el('p', 'lbl', 'أهم قيمتين عندي (اختر اثنتين)'));
    var b = el('button', 'btn orange', 'أرسل واعرض بطاقتي'); b.disabled = true;
    function upd() { b.disabled = !(top.length === 2 && grow.length === 1); }
    chipGroup(c, VALUES, 2, top, true, upd);
    c.appendChild(el('p', 'lbl', 'قيمة أريد أن أنمّيها'));
    chipGroup(c, VALUES, 1, grow, true, upd);
    c.appendChild(el('p', 'muted', 'اكتب في ملاحظاتك خطوة صغيرة لتنميتها، وقرارًا قادمًا ستتخذه وأنت واعٍ بقيمك.'));
    b.onclick = function () { send('card', { top: top.slice(), grow: grow[0] }, null, { top: top.slice(), grow: grow[0] }); };
    c.appendChild(b);
    main.appendChild(c);
  }
  function cardInto(c, v) {
    var k = el('div', 'vcard');
    k.appendChild(el('span', 'sub', 'بوصلتك الداخلية'));
    k.appendChild(el('h2', null, 'بطاقة قيمي'));
    k.appendChild(el('p', 'sub', 'أهم قيمتين عندي'));
    var r = el('div', 'row');
    v.top.forEach(function (i) { var p = el('span', 'pill', VALUES[i][0]); p.style.background = VALUES[i][1]; r.appendChild(p); });
    k.appendChild(r);
    k.appendChild(el('p', 'sub', 'قيمة أريد أن أنمّيها'));
    var r2 = el('div', 'row'); var p2 = el('span', 'pill', VALUES[v.grow][0]); p2.style.background = VALUES[v.grow][1]; r2.appendChild(p2); k.appendChild(r2);
    k.appendChild(el('p', null, 'أنا شخص يقدّر … ولذلك …'));
    c.appendChild(k);
    c.appendChild(el('p', 'muted', 'صوّر بطاقتك واجعلها خلفية جوالك أسبوعًا، وأكمل الجملة بكلماتك.'));
  }

  joinNow();
  schedule();
</script>
</body>
</html>
